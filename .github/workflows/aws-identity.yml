name: AWS identity verification

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify GitHub OIDC identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      id-token: write

    steps:
      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "492767006448"
          role-session-name: github-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          unset-current-credentials: true
          retry-max-attempts: 2

      - name: Verify assumed identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          ACTUAL_ARN=$(aws sts get-caller-identity \
            --query Arn --output text)

          EXPECTED_PREFIX="arn:aws:sts::492767006448:assumed-role/vulnlab-github-deploy/"

          if [[ "$ACTUAL_ARN" != "$EXPECTED_PREFIX"* ]]; then
            echo "::error::Unexpected AWS identity"
            exit 1
          fi

          {
            echo "### AWS identity verified"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Ref: $GITHUB_REF"
            echo "- Commit: $GITHUB_SHA"
            echo "- AWS role: vulnlab-github-deploy"
          } >> "$GITHUB_STEP_SUMMARY"